<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Zhyto · TikTok</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { --bg:#0F2E2A; --card:#163B36; --ink:#F5EEDC; --muted:#A9BDB5; --gold:#E4B456; --bad:#F08A7E; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border-radius:20px; padding:28px 24px; max-width:420px; width:100%; text-align:center; }
  img { width:72px; height:72px; border-radius:18px; }
  h1 { font-size:22px; margin:16px 0 8px; }
  p { color:var(--muted); margin:0; }
  .ok { color:var(--gold); } .bad { color:var(--bad); }
</style>
</head>
<body>
<main class="card">
  <img src="/icon.png" alt="Zhyto">
  <h1 id="t">Connecting TikTok…</h1>
  <p id="m">Zhyto internal publishing tool for @zhyto.app.</p>
</main>
<script>
  // Our own publishing tool: hands the TikTok sign-in code to the server, which checks the state and stores the
  // tokens. Nothing is stored in this page.
  (function () {
    var q = new URLSearchParams(location.search), t = document.getElementById('t'), m = document.getElementById('m');
    function done(ok, title, msg) { t.textContent = title; t.className = ok ? 'ok' : 'bad'; m.textContent = msg; history.replaceState(null, '', location.pathname); }
    if (q.get('error')) return done(false, 'TikTok sign-in cancelled', q.get('error_description') || q.get('error'));
    if (!q.get('code') || !q.get('state')) return done(false, 'Nothing to connect', 'Open the sign-in link from the Zhyto team.');
    fetch('https://iigtqxmotibulefnixdm.supabase.co/functions/v1/tiktok-auth', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: q.get('code'), state: q.get('state') })
    }).then(function (r) { return r.json(); }).then(function (r) {
      if (r.ok) done(true, 'TikTok connected', 'You can close this page.');
      else done(false, 'Could not connect', r.error === 'state_mismatch' ? 'The link expired. Ask for a new one.' : (r.description || r.error || 'Try again.'));
    }).catch(function () { done(false, 'Could not connect', 'Network error. Try again.'); });
  })();
</script>
</body>
</html>
