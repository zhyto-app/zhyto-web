<style>
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 8px; padding: 0; list-style: none; }
.toc a { display: inline-block; padding: 8px 14px; border-radius: 999px; background: var(--s1); border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 14px; }
.sec { background: var(--s1); border: 1px solid var(--line); border-radius: 22px; padding: 22px; margin: 18px 0; display: flex; flex-direction: column; gap: 18px; }
.sec .txt { display: flex; flex-direction: column; gap: 10px; }
.sec h2 { margin: 0; }
.sec .why { color: var(--muted); margin: 0; font-size: 17px; }
.sec .steps { margin: 0; }
.sec .steps li { font-size: 17px; }
.shot { margin: 0; text-align: center; }
.shot img { width: 100%; max-width: 300px; border-radius: 28px; border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(15,46,42,.14); }
.langs { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 14px; }
.langs a { color: var(--muted); text-decoration: none; }
.langs b { color: var(--ink); font-weight: 600; }
@media (min-width: 700px) { .sec.has-shot { flex-direction: row; align-items: flex-start; } .sec.has-shot .txt { flex: 1; } .sec.has-shot .shot { width: 280px; flex: none; } }
