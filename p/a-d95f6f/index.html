<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жито — ролики «відкладаєш»</title><meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Жито — ролики «відкладаєш»"><meta property="og:description" content="Два ролики для реклами Android">
<meta property="og:image" content="https://zhyto.app/vote/og.png?v=3"><meta name="theme-color" content="#0F2E2A"><link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5EEDC;--ink:#0F2E2A;--mut:#5b6b66;--card:#fffaf0;--line:#e3d9c2}
@media (prefers-color-scheme:dark){:root{--bg:#0B201D;--ink:#F5EEDC;--mut:#a9b8b2;--card:#12302b;--line:#1f4640}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Onest',sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1{font:700 30px/1.15 'Geologica',sans-serif;margin:0 0 8px}h1 span{color:#E4B456}
.lead{color:var(--mut);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 16px}
.card h2{font:700 19px/1.25 'Geologica',sans-serif;margin:0 0 12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
figure{margin:0}video{width:100%;aspect-ratio:9/16;border-radius:14px;background:#000;display:block}
a.open{display:block;text-align:center;font-size:13px;color:var(--mut);margin-top:4px}figcaption{text-align:center;color:var(--mut);font-size:14px;margin-top:6px}
footer{color:var(--mut);font-size:13px;margin-top:24px;text-align:center}
</style></head><body><main>
<h1>Жито — <span>«відкладаєш»</span></h1>
<p class="lead">Два ролики для реклами Android. Послухай голос і скажи, чи йдемо.</p>
<section class="card"><h2>А · «Давно плануєш вести бюджет і все відкладаєш?»</h2>
<figure><video src="a.mp4" poster="a.jpg" controls playsinline webkit-playsinline preload="none"></video><a class="open" href="a.mp4">Відкрити відео окремо ↗</a></figure></section>
<section class="card"><h2>Б · «Ти тричі починав вести витрати. І тричі кидав»</h2>
<figure><video src="b.mp4" poster="b.jpg" controls playsinline webkit-playsinline preload="none"></video><a class="open" href="b.mp4">Відкрити відео окремо ↗</a></figure></section>
</main></body></html>
